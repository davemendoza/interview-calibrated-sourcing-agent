[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-calibrated-sourcing-agent"
version = "0.1.0"
description = "Open-web sourcing agent calibrated by post-interview evaluations."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dave Mendoza" }]
license = { text = "MIT" }
dependencies = ["requests>=2.31", "openpyxl>=3.1", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
icsa = "icsa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
