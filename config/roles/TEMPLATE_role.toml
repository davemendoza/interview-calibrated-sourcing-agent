# =============================================================================
# ROLE TEMPLATE: copy this file to start a new domain or role
# =============================================================================
#   cp config/roles/TEMPLATE_role.toml config/roles/my_role.toml
#   icsa run --role config/roles/my_role.toml
#
# Fill in every line marked  >>> CUSTOMIZE.  The interview signals below are
# generic to senior engineering roles and can be kept, edited or replaced.
# See example_fintech_staff_payments_engineer.toml for a complete worked example.
# The agent warns and scores nobody until the domain requirement has terms.
# =============================================================================

[labels]
domain_name = ""                    # >>> CUSTOMIZE: e.g. "healthcare data", "robotics", "ad tech"
tier1 = "Strong Recommend"          # optional: rename to your team's words
tier2 = "Recommend"
tier3 = "Pipeline depth"
pending = "Pending research"
identity_review = "Identity review"

[role]
title = ""                          # >>> CUSTOMIZE: the role you are sourcing
metros = []                         # >>> CUSTOMIZE: any of "sf_bay", "nyc" (add more in src/icsa/config.py METROS)
recency_years = 3
tier1_min_channels = 2
tier1_min_commits = 75

# -----------------------------------------------------------------------------
# Stage 0: interview calibration.   >>> CUSTOMIZE
# Use the follow-up questions that actually decided your past interviews.
# `icsa recalibrate` adjusts these weights from data/outcomes.csv.
# -----------------------------------------------------------------------------

# >>> CUSTOMIZE: add one domain-specific signal, the follow-up candidates most
# often failed in your loop. Uncomment and fill in:
# [[interview_signals]]
# id = "domain_correctness"
# label = ""
# weight = 1.0
# terms = []
# screen_question = ""

[[interview_signals]]
id = "owned_decision"
label = "One owned, defended technical decision with alternatives and a result"
weight = 1.0
terms = ["rfc", "design doc", "architecture decision", "adr", "proposal", "migrat", "rewrite", "deprecat", "tradeoff", "trade-off"]
screen_question = "Tell me about one technical decision you personally made and defended. What were the alternatives, who disagreed, and what happened?"

[[interview_signals]]
id = "incident_to_prevention"
label = "Incident told from detection to prevention"
weight = 0.8
terms = ["incident", "postmortem", "post-mortem", "outage", "on-call", "oncall", "slo", "sla", "root cause", "resilien"]
screen_question = "Describe an incident you led from detection to prevention. What changed in the process, not just the code?"

[[interview_signals]]
id = "cross_team_influence"
label = "Cross-team influence with a mechanism (contracts, reviews, shared libraries)"
weight = 0.8
terms = ["platform", "sdk", "framework", "library", "api contract", "schema", "maintainer", "core team", "standard", "spec"]
screen_question = "How did you get another team to adopt something you built? What was the mechanism: a contract, a review, a shared library?"

[[interview_signals]]
id = "ai_with_verification"
label = "AI use with a verification story"
weight = 0.7
terms = ["llm", "machine learning", " ml ", "agent", "copilot", "eval"]
screen_question = "Give me a concrete case where AI-generated output was wrong and how you caught it. What do you keep deterministic?"

# -----------------------------------------------------------------------------
# Role requirements.   >>> CUSTOMIZE
# kind = "domain"   decides whether a lead is scored at all
# kind = "core"     general skills, shown as met / no evidence
# kind = "adjacent" neighboring fields that count toward Tier 3 only
# -----------------------------------------------------------------------------

[[requirements]]
id = "domain"
label = ""                          # >>> CUSTOMIZE: e.g. "Clinical data systems work"
kind = "domain"
terms = []                          # >>> CUSTOMIZE: your domain vocabulary, lowercase

[[requirements]]
id = "backend_scale"
label = "Backend systems at scale"
kind = "core"
terms = ["distributed", "kafka", "grpc", "microservice", "postgres", "database", "throughput", "latency", "event", "stream", "queue"]

# =============================================================================
# YOUR TALENT ECOSYSTEM MAP   >>> CUSTOMIZE: this is what makes the agent work
# =============================================================================
# The agent only searches where you point it. Add one [[ecosystem]] entry for
# each place where people in your job family leave public evidence of their
# work. Aim for every category below; `icsa ecosystem` shows what is missing.
#
# Fastest route: paste the prompt in docs/BUILD_YOUR_ECOSYSTEM.md into Claude
# with your job description, and it will draft these entries for you.
#
# Every entry has:
#   category  code | patents | research | blogs | conferences | meetups |
#             associations | standards | packages | other
#   name      a label you will recognize
#   use       harvest  = find new leads here (needs source and value)
#             verify   = a page that confirms people found elsewhere (needs url)
#             taxonomy = a page that teaches the field's vocabulary (needs url)
#   source    for harvest only: github_repo | patent_assignee |
#             openalex_institution | sessionize | rss | pypi | npm
#   value     for harvest only: owner/repo, company as spelled on patents,
#             institution name, Sessionize event id, feed URL, or package name
#   url       for verify and taxonomy: the full web address
#   org       optional: the employer behind a blog feed (helps identity checks)
#   notes     optional: anything a teammate should know
#
# Rules that keep results trustworthy:
#   * Only add URLs you have opened yourself. Never guess an address.
#   * A blog feed creates leads only if its posts name their authors;
#     otherwise mark it taxonomy.
#   * Association member lists are rarely public: use them for taxonomy and
#     verification, never as lead lists.
#   * Big industry shows skew toward executives; engineering conferences and
#     meetups surface more individual contributors.
#
# Copy any example below, uncomment it (remove the leading "# "), and fill it in.

# ---- Code ----
# [[ecosystem]]
# category = "code"
# name = ""
# use = "harvest"
# source = "github_repo"
# value = ""            # owner/repo

# ---- Patents ----
# [[ecosystem]]
# category = "patents"
# name = ""
# use = "harvest"
# source = "patent_assignee"
# value = ""            # company exactly as spelled on USPTO filings

# ---- Research ----
# [[ecosystem]]
# category = "research"
# name = ""
# use = "harvest"
# source = "openalex_institution"
# value = ""            # institution name as OpenAlex lists it

# ---- Engineering blogs ----
# [[ecosystem]]
# category = "blogs"
# name = ""
# use = "harvest"       # or "taxonomy" if the feed has no author names
# source = "rss"
# value = ""            # RSS or Atom feed URL
# org = ""              # employer behind the blog

# ---- Conferences ----
# [[ecosystem]]
# category = "conferences"
# name = ""
# use = "harvest"
# source = "sessionize"
# value = ""            # Sessionize event id
#
# [[ecosystem]]
# category = "conferences"
# name = ""
# use = "verify"
# url = ""              # speaker or agenda page

# ---- Meetups ----
# [[ecosystem]]
# category = "meetups"
# name = ""
# use = "verify"
# url = ""              # past-event speaker page

# ---- Associations ----
# [[ecosystem]]
# category = "associations"
# name = ""
# use = "taxonomy"      # or "verify" for public speaker or working-group pages
# url = ""

# ---- Standards and rule books ----
# [[ecosystem]]
# category = "standards"
# name = ""
# use = "taxonomy"
# url = ""

# ---- Package registries ----
# [[ecosystem]]
# category = "packages"
# name = ""
# use = "harvest"
# source = "pypi"       # or "npm"
# value = ""            # package name

# Harvester tuning (the ecosystem entries supply the seeds).
[sources.github]
min_contributions = 10
max_contributors_per_repo = 60

[sources.patents]
endpoint = "https://search.patentsview.org/api/v1/patent/"
since = "2021-01-01"
max_per_assignee = 300

[sources.openalex]
topics = []                         # >>> CUSTOMIZE: research topics for your field
since = "2019-01-01"
max_per_query = 50

# ---------------------------------------------------------------------------
# Optional AI judgment step. After the keyword rules flag a possible signal,
# a model reads the evidence and must quote the exact words that show it.
# Only Tier 1 and Tier 2 leads are judged. Needs ANTHROPIC_API_KEY in .env.
# Haiku is enough for this short reading task and keeps cost low.
# ---------------------------------------------------------------------------
[judge]
enabled = false
model = "claude-haiku-5-5"
max_evidence_per_signal = 3
