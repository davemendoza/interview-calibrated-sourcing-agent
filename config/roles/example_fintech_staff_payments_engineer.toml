notes = "Developer conference for fintech. Speakers are listed per event and in the video archive; add the speaker page for each year"

# >>> CUSTOMIZE: add Sessionize event ids (source = "sessionize") for
# engineering conferences that publish on Sessionize, and verify-pages for
# Money20/20, Nacha's Smarter Faster Payments, QCon and Kafka or Postgres
# conferences. Big payments shows skew toward executives; engineering and
# infrastructure conferences surface more Staff-level speakers.

# ---- Meetups ----
# >>> CUSTOMIZE: add past-event speaker pages (use = "verify") for payments,
# fintech and infrastructure meetups in your target metros. Repeat speakers
# and organizers are strong signals.

# ---- Package registries ----
# >>> CUSTOMIZE: add independently maintained payments, ACH or ISO 20022
# libraries (source = "pypi" or "npm"). Company SDKs list the company as
# author and create no leads.

# Harvester tuning (ecosystem entries supply the seeds above).
[sources.github]
min_contributions = 10
max_contributors_per_repo = 60

[sources.patents]
endpoint = "https://search.patentsview.org/api/v1/patent/"
since = "2021-01-01"
max_per_assignee = 300

[sources.openalex]
topics = ["payments", "ledger", "fraud detection", "distributed transactions"]
since = "2019-01-01"
max_per_query = 50

# ---------------------------------------------------------------------------
# Optional AI judgment step. After the keyword rules flag a possible signal,
# a model reads the evidence and must quote the exact words that show it.
# Only Tier 1 and Tier 2 leads are judged. Needs ANTHROPIC_API_KEY in .env.
# Haiku is enough for this short reading task and keeps cost low.
# ---------------------------------------------------------------------------
[judge]
enabled = false
model = "claude-haiku-5-5"
max_evidence_per_signal = 3
